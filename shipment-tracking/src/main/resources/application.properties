spring.application.name=shipment-tracking

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/shipment_tracking}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

server.port=${SERVER_PORT:8081}

security.jwt.secret=${JWT_SECRET:change-me-change-me-change-me-change-me}
rate-limit.requests-per-minute=${RATE_LIMIT_REQUESTS_PER_MINUTE:1000}
